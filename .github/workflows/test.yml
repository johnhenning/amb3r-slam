name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
          python-version-file: '.python-version'
          enable-cache: true
      - name: Install locked development and model dependencies
        run: uv sync --locked --extra train --extra export
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync amber synthetic data/synthetic --frames 16 --size 32
      - run: uv run --no-sync amber train configs/smoke_train.json
      - run: uv run --no-sync amber export runs/smoke_training/last.pt runs/smoke_training/model.onnx
        env:
          OMP_NUM_THREADS: '2'
